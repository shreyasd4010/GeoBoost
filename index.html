<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GeoBoost Territory Optimizer | ABInBev</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{ --bg:#0b0b0c; --panel:#111114; --text:#eaeaf0; --accent:#ffd166; --accent2:#8ab4ff; }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;}
    .app{display:grid;grid-template-columns:380px 1fr;height:100%}
    aside{background:var(--panel);padding:12px;overflow-y:auto;border-right:1px solid #23242a;}
    main{position:relative}
    #map{position:absolute;inset:0}
    
    h2{font-size:16px;color:var(--accent);margin:0 0 10px;}
    .card{background:#0f1013;border:1px solid #23242a;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
    label{font-size:11px;color:#888;font-weight:bold;display:block;margin-bottom:5px;}
    
    button,select,input{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #2a2c34;background:#121318;color:var(--text);font-size:11px;cursor:pointer;}
    button:hover{background:#1d1f25;}
    button.primary{background:var(--accent);color:#000;font-weight:bold;border:none;}
    button.action{border:1px solid var(--accent2);color:var(--accent2);font-weight:bold;}
    
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .tabs{display:flex;gap:4px;margin-bottom:10px;}
    .tab{flex:1;padding:8px;text-align:center;border:1px solid #2a2c34;cursor:pointer;font-size:11px;border-radius:6px;}
    .tab.active{background:#2a2c34;color:#fff;font-weight:bold;}
    
    .status-msg{font-size:10px;padding:6px;border-radius:4px;margin-bottom:10px;background:#1f2937;display:none;}
    table{width:100%;font-size:10px;border-collapse:collapse;margin-top:8px;}
    th,td{text-align:left;padding:6px;border-bottom:1px solid #2a2c34;}
    .legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
    .item{font-size:9px;display:flex;align-items:center;gap:4px;background:#1a1b20;padding:2px 6px;border-radius:10px;border:1px solid #2a2c34;}
    .swatch{width:8px;height:8px;border-radius:2px;}
  </style>
</head>

<body>
<div class="app">
  <aside>
    <h2>GeoBoost Territory Optimizer <span id="pbiBadge" style="display:none;color:var(--accent);font-size:10px;">[PBI LINKED]</span></h2>
    <div id="statusBox" class="status-msg"></div>

    <div class="card">
      <label>View Mode</label>
      <div class="tabs" id="viewTabs">
        <div class="tab active" data-view="asIs">As-Is</div>
        <div class="tab" data-view="optimized">Optimized</div>
      </div>
      <button id="btnSeed">Seed Optimized from As-Is</button>
    </div>

    <div class="card">
      <label>1. Map Shapes (Automatic or Manual)</label>
      <div id="ghStatus" style="font-size:10px; color:#4ade80; margin-bottom:5px; display:none;">✔ GitHub Data Loaded</div>
      <input id="shapeFile" type="file" accept=".json,.geojson" />
    </div>

    <div class="card">
      <label>2. Data Selection</label>
      <div class="grid">
        <button id="btnSelectRect">Rectangle</button>
        <button id="btnSelectLasso">Lasso</button>
      </div>
      <button id="btnSelectAll">Select All (Filtered)</button>
      <button id="btnClearSel" style="color:#ff5555">Clear Selection</button>
    </div>

    <div class="card">
      <label>3. Assignment</label>
      <select id="bdrSelect"><option value="">Select Existing BDR</option></select>
      <input id="bdrInput" placeholder="Or type new BDR name"/>
      <div class="grid">
        <button id="btnAssign" class="primary">Assign</button>
        <button id="btnClearAssign">Remove</button>
      </div>
      <button id="btnAutoFill" class="action" style="margin-top:10px;">✨ Smart Fill Gaps</button>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <label>4. Summary & Export</label>
      <button id="btnExport">Export CSV</button>
      <table>
        <thead><tr><th>BDR</th><th>Count</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </aside>

  <main><div id="map"></div></main>
</div>

<script>
/* ================= CONFIG & STATE ================= */
const GEOJSON_URL = "https://shreyasd4010.github.io/GeoBoost/NL_PC4.json";
const state = {
  map:null, currentView:'asIs', shapes:null, propKey:'PC4',
  features:new Map(), centroids:new Map(),
  assignments:{ asIs:new Map(), optimized:new Map() },
  selection:new Set(), rawData:[], geoLayer:null
};

const bdrColors = {};
const palette = ["#4ade80","#60a5fa","#f472b6","#f97316","#facc15","#c084fc","#22d3ee"];

/* ================= INIT ================= */
window.onload = async () => {
  state.map = L.map("map", { preferCanvas: true }).setView([52.1, 5.3], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { opacity: 0.4 }).addTo(state.map);

  initDraw();
  await loadShapes();
  checkPowerBI();
};

/* ================= SPATIAL LOGIC ================= */
async function loadShapes(fileData = null) {
  try {
    const geo = fileData || await fetch(GEOJSON_URL).then(r => r.json());
    state.shapes = geo;
    
    if (!fileData) document.getElementById('ghStatus').style.display = 'block';

    state.features.clear();
    state.centroids.clear();

    geo.features.forEach(f => {
      const c = String(f.properties[state.propKey]);
      state.features.set(c, f);
      state.centroids.set(c, turf.centroid(f).geometry.coordinates);
    });

    renderMap();
    if (!fileData) state.map.fitBounds(state.geoLayer.getBounds());
  } catch(e) {
    setStatus("Fetch failed. Please upload manually.", "#ff5555");
  }
}

function renderMap() {
  if (state.geoLayer) state.map.removeLayer(state.geoLayer);
  
  state.geoLayer = L.geoJSON(state.shapes, {
    style: styleFn,
    onEachFeature: (f, l) => {
      l.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        const c = String(f.properties[state.propKey]);
        if (state.selection.has(c)) state.selection.delete(c);
        else state.selection.add(c);
        restyle();
      });
      l.bindTooltip(() => {
        const c = String(f.properties[state.propKey]);
        const b = state.assignments[state.currentView].get(c) || "Unassigned";
        return `<b>${c}</b><br>${b}`;
      }, { sticky: true });
    }
  }).addTo(state.map);
}

function styleFn(f) {
  const c = String(f.properties[state.propKey]);
  const b = state.assignments[state.currentView].get(c);
  const isSelected = state.selection.has(c);

  if (!b) return { fillOpacity: 0.1, color: isSelected ? "#fff" : "#444", weight: isSelected ? 2 : 0.5 };
  
  if (!bdrColors[b]) bdrColors[b] = palette[Object.keys(bdrColors).length % palette.length];
  return { 
    fillColor: bdrColors[b], 
    fillOpacity: 0.7, 
    color: isSelected ? "#fff" : "#222", 
    weight: isSelected ? 2 : 0.5 
  };
}

function restyle() {
  if (state.geoLayer) state.geoLayer.setStyle(styleFn);
}

/* ================= SELECTION TOOLS ================= */
function initDraw() {
  const drawControl = new L.Control.Draw({
    draw: { polyline:false, marker:false, circle:false, circlemarker:false, 
            rectangle: { shapeOptions: { color: '#fff' } },
            polygon: { shapeOptions: { color: '#fff' } } }
  });

  state.map.on(L.Draw.Event.CREATED, (e) => {
    const layer = e.layer;
    const poly = layer.toGeoJSON();
    state.features.forEach((feat, code) => {
      const pt = state.centroids.get(code);
      if (pt && turf.booleanPointInPolygon(turf.point(pt), poly)) {
        state.selection.add(code);
      }
    });
    restyle();
  });
}

/* ================= POWER BI & DATA ================= */
function checkPowerBI() {
  if (window.name) {
    try {
      const data = JSON.parse(window.name);
      state.rawData = data;
      document.getElementById("pbiBadge").style.display = "inline";
      applyAssignments();
    } catch(e) {}
  }
}

function applyAssignments() {
  state.assignments.asIs.clear();
  state.rawData.forEach(r => {
    if (r.PostalCode) state.assignments.asIs.set(String(r.PostalCode), r.BDR);
  });
  refreshUI();
}

/* ================= UI HELPERS ================= */
function refreshUI() {
  const bdrs = [...new Set([...state.assignments.asIs.values(), ...state.assignments.optimized.values()])].filter(Boolean);
  document.getElementById("bdrSelect").innerHTML = '<option value="">Select Existing BDR</option>' + 
    bdrs.sort().map(b => `<option>${b}</option>`).join("");
  
  renderLegend(bdrs);
  renderSummary();
  restyle();
}

function renderLegend(bdrs) {
  const leg = document.getElementById("legend");
  leg.innerHTML = bdrs.map(b => `
    <div class="item"><span class="swatch" style="background:${bdrColors[b] || '#333'}"></span>${b}</div>
  `).join("");
}

function renderSummary() {
  const counts = {};
  state.assignments[state.currentView].forEach(b => counts[b] = (counts[b] || 0) + 1);
  document.getElementById("statsBody").innerHTML = Object.entries(counts)
    .sort((a,b) => b[1] - a[1])
    .map(([b,c]) => `<tr><td>${b}</td><td>${c}</td></tr>`).join("");
}

function setStatus(msg, color) {
  const box = document.getElementById("statusBox");
  box.style.display = "block"; box.innerText = msg; box.style.color = color;
}

/* ================= BUTTON EVENTS ================= */
document.getElementById("shapeFile").onchange = async (e) => {
  const reader = new FileReader();
  reader.onload = (ev) => loadShapes(JSON.parse(ev.target.result));
  reader.readAsText(e.target.files[0]);
};

document.getElementById("btnSelectRect").onclick = () => new L.Draw.Rectangle(state.map).enable();
document.getElementById("btnSelectLasso").onclick = () => new L.Draw.Polygon(state.map).enable();
document.getElementById("btnClearSel").onclick = () => { state.selection.clear(); restyle(); };

document.getElementById("btnAssign").onclick = () => {
  const b = document.getElementById("bdrInput").value || document.getElementById("bdrSelect").value;
  if (!b) return alert("Select or type a BDR name");
  state.selection.forEach(c => state.assignments[state.currentView].set(c, b));
  state.selection.clear();
  refreshUI();
};

document.getElementById("btnAutoFill").onclick = () => {
  const currentMap = state.assignments[state.currentView];
  const assigned = [];
  state.centroids.forEach((pt, code) => {
    if (currentMap.has(code)) assigned.push({ pt: turf.point(pt), bdr: currentMap.get(code) });
  });

  if (assigned.length === 0) return alert("Assign at least one BDR first!");

  const assignedCollection = turf.featureCollection(assigned.map(a => a.pt));
  state.centroids.forEach((pt, code) => {
    if (!currentMap.has(code)) {
      const nearest = turf.nearestPoint(turf.point(pt), assignedCollection);
      currentMap.set(code, assigned[nearest.properties.featureIndex].bdr);
    }
  });
  refreshUI();
};

document.getElementById("viewTabs").onclick = (e) => {
  if (!e.target.dataset.view) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
  state.currentView = e.target.dataset.view;
  refreshUI();
};

document.getElementById("btnSeed").onclick = () => {
  state.assignments.optimized = new Map(state.assignments.asIs);
  refreshUI();
};

document.getElementById("btnExport").onclick = () => {
  let csv = "PostalCode,BDR\n";
  state.assignments[state.currentView].forEach((b,c) => csv += `${c},${b}\n`);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `GeoBoost_${state.currentView}.csv`; a.click();
};
</script>
</body>
</html>
