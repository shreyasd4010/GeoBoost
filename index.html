<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GeoBoost Territory Optimizer</title>

  <!-- Libraries -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    html,body{margin:0;height:100%;background:#0b0b0c;color:#eaeaf0;font-family:system-ui}
    .app{display:grid;grid-template-columns:380px 1fr;height:100%}
    aside{background:#111;padding:12px;overflow:auto}
    main{position:relative}
    #map{position:absolute;inset:0}
    .card{background:#0f1013;border:1px solid #23242a;border-radius:10px;padding:10px;margin-bottom:10px}
    button,select,input{width:100%;padding:6px;margin-top:6px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .tab{padding:6px;text-align:center;border:1px solid #333;cursor:pointer}
    .tab.active{background:#333}
    .legend{display:flex;flex-wrap:wrap;gap:4px}
    .item{font-size:10px}
    table{width:100%;font-size:10px}
  </style>
</head>

<body>
<div class="app">
  <aside>
    <h3>GeoBoost <span id="pbiBadge" style="display:none;color:#facc15">POWER BI</span></h3>

    <div class="card">
      <div class="grid" id="viewTabs">
        <div class="tab active" data-view="asIs">As-Is</div>
        <div class="tab" data-view="optimized">Optimized</div>
      </div>
      <button id="btnSeed">Seed Optimized</button>
    </div>

    <div class="card">
      <label>Filter by BDR</label>
      <select id="filterBDR" multiple></select>
      <div class="grid">
        <button id="btnApplyFilters">Apply</button>
        <button id="btnClearFilter">Reset</button>
      </div>
    </div>

    <div class="card">
      <button id="btnSelectRect">Rectangle</button>
      <button id="btnSelectLasso">Lasso</button>
      <button id="btnSelectAll">Select All</button>
      <button id="btnClearSel">Clear</button>

      <select id="bdrSelect"></select>
      <input id="bdrInput" placeholder="New BDR"/>
      <button id="btnAssign">Assign</button>
      <button id="btnClearAssign">Clear Assign</button>
    </div>

    <div class="card">
      <button id="btnAutoFill">✨ Fill Gaps</button>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <button id="btnExport">Export CSV</button>
      <table>
        <thead><tr><th>BDR</th><th>Count</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </aside>

  <main><div id="map"></div></main>
</div>

<script>
/* ================= CONFIG ================= */
const GEOJSON_URL =
  "https://shreyasd4010.github.io/GeoBoost/NL_PC4.json";

/* ================= STATE ================= */
const state={
  map:null,currentView:'asIs',
  shapes:null,propKey:'PC4',
  features:new Map(),centroids:new Map(),
  assignments:{asIs:new Map(),optimized:new Map()},
  selection:new Set(),rawData:[]
};

const colors={},palette=["#4ade80","#60a5fa","#f472b6","#f97316"];

/* ================= INIT ================= */
window.onload=async()=>{
  state.map=L.map("map").setView([52.1,5.3],7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(state.map);

  await loadShapes();
  initPowerBI();
};

/* ================= SHAPES ================= */
async function loadShapes(){
  const geo=await fetch(GEOJSON_URL).then(r=>r.json());
  state.shapes=geo;
  geo.features.forEach(f=>{
    const c=f.properties[state.propKey];
    state.features.set(c,f);
  });
  L.geoJSON(geo,{style:styleFn}).addTo(state.map);
}

/* ================= POWER BI ================= */
function initPowerBI(){
  if(window.name){
    try{
      const data=JSON.parse(window.name);
      state.rawData=data;
      document.getElementById("pbiBadge").style.display="inline";
      applyAssignments();
    }catch(e){}
  }
}

/* ================= ASSIGN ================= */
function applyAssignments(){
  state.assignments.asIs.clear();
  state.rawData.forEach(r=>{
    state.assignments.asIs.set(r.PostalCode,r.BDR);
  });
  refreshUI();
}

/* ================= UI ================= */
function styleFn(f){
  const c=f.properties[state.propKey];
  const b=state.assignments[state.currentView].get(c);
  if(!b)return{fillOpacity:0.1,color:"#444"};
  if(!colors[b])colors[b]=palette[Object.keys(colors).length%palette.length];
  return{fillColor:colors[b],fillOpacity:0.7,color:"#222"};
}

function refreshUI(){
  const bdrs=[...new Set(state.assignments.asIs.values())];
  document.getElementById("bdrSelect").innerHTML=
    "<option></option>"+bdrs.map(b=>`<option>${b}</option>`).join("");
  document.getElementById("filterBDR").innerHTML=
    bdrs.map(b=>`<option value="${b}">${b}</option>`).join("");
  renderSummary();
}

function renderSummary(){
  const body=document.getElementById("statsBody");
  const counts={};
  state.assignments[state.currentView].forEach(b=>{
    counts[b]=(counts[b]||0)+1;
  });
  body.innerHTML=Object.entries(counts)
    .map(([b,c])=>`<tr><td>${b}</td><td>${c}</td></tr>`).join("");
}

/* ================= BUTTONS ================= */
document.getElementById("btnSeed").onclick=()=>{
  state.assignments.optimized=new Map(state.assignments.asIs);
};

document.getElementById("btnAssign").onclick=()=>{
  const b=document.getElementById("bdrSelect").value||
          document.getElementById("bdrInput").value;
  state.selection.forEach(c=>state.assignments[state.currentView].set(c,b));
  refreshUI();
};

document.getElementById("btnClearAssign").onclick=()=>{
  state.selection.forEach(c=>state.assignments[state.currentView].delete(c));
  refreshUI();
};

document.getElementById("btnExport").onclick=()=>{
  let csv="PostalCode,BDR\n";
  state.assignments[state.currentView].forEach((b,c)=>csv+=`${c},${b}\n`);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="GeoBoost.csv";a.click();
};

document.getElementById("viewTabs").onclick=e=>{
  if(!e.target.dataset.view)return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.target.classList.add("active");
  state.currentView=e.target.dataset.view;
  loadShapes();
};
</script>
</body>
</html>
