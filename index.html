<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoBoost Territory Optimizer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

<script>
const GEOJSON_URL = "./NL_PC4.json";

let map = L.map("map").setView([52.1,5.3], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
  .addTo(map);

/**
 * Load the geojson file from this GitHub Pages site
 */
async function loadGeoJSON() {
  try {
    let res = await fetch(GEOJSON_URL);
    if (!res.ok) throw new Error("GeoJSON load failed");
    let geo = await res.json();

    L.geoJSON(geo, {
      style: function (f) {
        return {
          color: "#444",
          weight: 0.6,
          fillColor: "#88c",
          fillOpacity: 0.5
        };
      }
    }).addTo(map);

    map.fitBounds(L.geoJSON(geo).getBounds().pad(0.1));

  } catch (e) {
    console.error("Failed to load GeoJSON: ", e);
  }
}

loadGeoJSON();
</script>

</body>
</html>
